plugins {
    id 'java'
    id 'application'
}

group = 'io.github.arielzs'
version = '1.0'

repositories {
    mavenCentral()
}

dependencies {
    // O BOM do JUnit fixa a mesma versao para todos os modulos do JUnit 6
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // O Gradle 9 exige o launcher do JUnit Platform no classpath de execucao dos testes
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'io.github.arielzs.andesite.Main'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Compila para Java 17 mesmo que o JDK instalado seja mais novo (ex.: 25)
    options.release = 17
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addStringOption('charset', 'UTF-8')
    options.windowTitle = 'Andesite Hardware Co. - Documentação'
    options.docTitle = 'Andesite Hardware Co. - Planta Industrial'
    // Sem esta opção o Javadoc ignora as tags @author na página gerada
    options.author = true
}

tasks.named('run') {
    // Necessário: sem isso o Scanner(System.in) do menu não recebe o teclado
    standardInput = System.in
    // Faz o programa escrever em UTF-8, que é como o Gradle lê a saída. Sem isso, no
    // Windows os acentos aparecem trocados por símbolos estranhos
    jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
}

tasks.named('test') {
    // Diz ao Gradle para descobrir e executar os testes escritos com JUnit
    useJUnitPlatform()
    // Os testes nunca leem o teclado nem usam os arquivos reais da aplicacao
    jvmArgs '-Dfile.encoding=UTF-8'
    // Falhas ocasionais do Windows ao limpar @TempDir geram aviso, nao falha do teste
    systemProperty 'junit.jupiter.tempdir.deletion.strategy.default',
            'org.junit.jupiter.api.io.TempDirDeletionStrategy$IgnoreFailures'
    testLogging {
        // Mostra no terminal quais testes passaram, falharam ou foram ignorados
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
        showStandardStreams = false
    }
    // Relatorio HTML em build/reports/tests/test/index.html
    reports {
        html.required = true
    }
}
